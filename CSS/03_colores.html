<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colores</title>
    <style>
        body {
            background-color: #27272c;
        }
        h1 {
            color: white;
        }
        h2 {
            color: #bcffbf
        }
        h3{
            color: rgba(255, 221, 221, 0.973);            
        }
        h4{
            color: rgb(240, 240, 178);
        }
        h5{
            color: hsl(187, 89%, 85%);
        }
    </style>
</head>
<body>
    <h1>Maneras de establecer colores</h1>
    <h1>Por nombre del color</h1>
    <h2>Por valor hexadecimal</h2>
    <h3>Por valor RGBA</h3>
    <h4>Por valor RGB</h4>
    <h5>Por valor HSL</h5>
</body>
</html>
