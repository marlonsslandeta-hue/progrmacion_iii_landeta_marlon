
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multimedia - Centro de Capacitación</title>
    <style>
        iframe {
            border: 2px solid #333;
            border-radius: 8px;
            display: block;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <h1>Multimedia</h1>

    <h2>Reproducir Video de Capacitación</h2>
    <video width="1000" height="500" controls>
        <source src="video/intros para videos(3).mp4" type="video/mp4">
        Tu navegador no soporta video HTML5.
    </video>

    <h2>Reproducir Audio Educativo</h2>
    <audio controls>
        <source src="musica/Meta Guacha, Callejero Fino, BM - Para la gilada REMIX (Video oficial).mp3" type="audio/mpeg">
        Actualiza tu navegador, no soporta HTML5.
    </audio>

    <h1>Centro de Capacitación</h1>

    <h2>Información Académica</h2>
    <iframe
        src="https://es.wikipedia.org/wiki/Educaci%C3%B3n_en_l%C3%ADnea"
        width="800"
        height="400"
        title="Información sobre educación en línea">
    </iframe>

    <h2>Formulario de Registro</h2>
    <iframe
        src="10_formularios.html"
        width="800"
        height="700"
        title="Formulario de registro de capacitaciones">
    </iframe>
</body>
</html>
