
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centro de Capacitación Online</title>
    <script>
        alert('¡Bienvenido al Centro de Capacitación Online!')
        console.log('Bienvenida desde el inicio de la página')
    </script>
</head>
<body>
    <h1>Incluir JavaScript en la plataforma de capacitación</h1>
    <h2>Modo Inline</h2>
    <button onclick="alert('¡Gracias por visitar nuestros cursos!')">
        Mostrar mensaje 
    </button>
    <input type="text"
        oninput="console.log(this.value)"
        placeholder="Escribe el nombre de un curso..." >
    <imput type="text"
        onchange="console.log('Datos del estudiante guardados')"
        placerholder="Escribe tu nombre y haz click afuera">
    <imput type="text"
        oninput="console.log(this.value)"
        onblur="alert('¡Atención! Saliste del campo de inscripción')"
        placeholder="Escribe el curso al que deseas inscribirte...">
    <imput type="text"
        onfocus="console.log('¡El estudiante está escribiendo!')"
        onblur="alert('¡Atención! Saliste del campo de correo electrónico')"
        placeholder="Ingresa tu correo electrónico...">
    <script src="01_incluir.js"></script>
           

</body>
</html>
